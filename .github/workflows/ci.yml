name: CI/CD Pipeline

on:
  push:
    branches: [ main, release/prod-v1 ]
  pull_request:
    branches: [ main, release/prod-v1 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/etp_test
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/etp_test

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check .

  security:
    name: Security Audit (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install "bandit[toml]"
      - name: Bandit (medium et haute severite bloquantes)
        run: bandit -r src/ -ll -f json -o bandit-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    needs: [lint, security]
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etp_test
        options: >-
          --health-cmd "pg_isready -U postgres -d etp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: test-key
      S3_SECRET_ACCESS_KEY: test-secret
      S3_BUCKET_NAME: test-bucket
      S3_BUCKET_CV: test-cv
      S3_REGION: auto
      S3_USE_SSL: "false"
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: test-key
      MINIO_SECRET_KEY: test-secret
      MINIO_BUCKET_NAME: test-bucket
      MINIO_BUCKET_CV: test-cv
      SECRET_KEY: test-secret-key-for-ci-only
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FIREBASE_PROJECT_ID: test-project
      FIREBASE_APP_CHECK_ENABLED: "false"
      RESEND_API_KEY: ""
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache des dependances Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi
      - name: Validate migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  frontend-check:
    name: Frontend Check (Type + Build)
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Vérification des types
        working-directory: frontend
        run: npm run type-check
      - name: Build de production
        working-directory: frontend
        run: npm run build

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend
        run: vercel --prod --yes --token $VERCEL_TOKEN
