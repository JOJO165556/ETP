[tool.poetry]
package-mode = false
name = "etp_platform"
version = "0.1.0"
description = ""
authors = ["JOJO <hounkpatijosue2020@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.49" }
asyncpg = "^0.31.0"
geoalchemy2 = "^0.19.0"
alembic = "^1.18.4"
python-dotenv = "^1.2.2"
pydantic = { extras = ["email"], version = "^2.13.3" }
psycopg2-binary = "^2.9.12"
pydantic-settings = "^2.2.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
bcrypt = "^4.1.2"
python-multipart = "^0.0.9"
aioboto3 = "^15.5.0"
celery = { extras = ["redis"], version = "^5.4.0" }
pdfplumber = "^0.11.0"
flower = "^2.0.1"
firebase-admin = ">=6.5,<7"
jinja2 = "^3.1.4"

httpx = "^0.28.1"
google-genai = "^2.24.0"
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
types-python-jose = "^3.3.4.20240106"
aiosqlite = "^0.20.0"
ruff = "^0.17.3"
python-dotenv = "^1.0.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "frontend",
    "alembic",
    ".agents",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

# E402 ignoré dans main.py car setup_logging() doit être appelé avant les imports de routers
[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]

# Configuration du type checker Pyrefly
[tool.pyrefly]
project_includes = ["."]
search_path = ["."]
python_interpreter = ".venv/bin/python"